name: daily
on:
  workflow_dispatch:
  schedule:
    # UTC 时间，北京时间需要 +8
    # 北京时间 8:00 / 13:00 / 18:00 / 23:00，一天 4 次
    - cron: '0 0,5,10,15 * * *'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: restore last percentage
        id: cache
        uses: actions/cache@v4
        with:
          path: .last_pct
          # 固定 key，所有运行共享同一份缓存
          key: last-pct-v1
      - name: send to feishu if percentage changed
        env:
          WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          python3 << 'EOF'
          import datetime, urllib.request, json, os, pathlib
          tz = datetime.timezone(datetime.timedelta(hours=8))
          now = datetime.datetime.now(tz)
          year = now.year
          start = datetime.datetime(year, 1, 1, tzinfo=tz)
          end = datetime.datetime(year + 1, 1, 1, tzinfo=tz)
          pct_float = (now - start).total_seconds() / (end - start).total_seconds() * 100
          pct = int(pct_float + 0.5)
          if now.month == 12 and now.day == 31:
              pct = 100
              pct_float = 100.0

          last_file = pathlib.Path('.last_pct')
          last_pct = -1
          if last_file.exists():
              try:
                  last_pct = int(last_file.read_text().strip())
              except:
                  pass

          # 详细日志
          print(f'==== 本次运行 ====')
          print(f'北京时间: {now.strftime("%Y-%m-%d %H:%M:%S")}')
          print(f'当前进度: {pct_float:.2f}% -> 整数 {pct}%')
          print(f'上次推送: {last_pct}%')

          if pct == last_pct:
              print(f'>>> 进度未变化，跳过推送')
              exit(0)

          print(f'>>> 进度从 {last_pct}% 变为 {pct}%，准备推送')

          length = 25
          filled = round(pct_float * length / 100)
          bar = '█' * filled + '░' * (length - filled)
          days_passed = (now - start).days
          days_left = (end - start).days - days_passed
          card = {
              "msg_type": "interactive",
              "card": {
                  "header": {
                      "title": {"tag": "plain_text", "content": f"🌱 {year} 年进度 · {pct}%"},
                      "template": "green"
                  },
                  "elements": [
                      {"tag": "div", "text": {"tag": "lark_md", "content": f"`{bar}` **{pct}%**"}},
                      {"tag": "div", "text": {"tag": "lark_md", "content": f"📅 已过 {days_passed} 天 · 还剩 {days_left} 天"}}
                  ]
              }
          }
          payload = json.dumps(card).encode('utf-8')
          req = urllib.request.Request(
              os.environ['WEBHOOK'],
              data=payload,
              headers={'Content-Type': 'application/json; charset=utf-8'}
          )
          response = urllib.request.urlopen(req).read().decode()
          print(f'飞书响应: {response}')
          last_file.write_text(str(pct))
          print(f'>>> 推送完成，已记录 {pct}%')
          EOF
      - name: save last percentage
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .last_pct
          key: last-pct-v1
