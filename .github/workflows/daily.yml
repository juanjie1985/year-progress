name: daily
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check and send
        env:
          WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          python3 << 'EOF'
          import datetime, urllib.request, json, os, pathlib

          tz = datetime.timezone(datetime.timedelta(hours=8))
          now = datetime.datetime.now(tz)
          year = now.year
          start = datetime.datetime(year, 1, 1, tzinfo=tz)
          end = datetime.datetime(year + 1, 1, 1, tzinfo=tz)
          pct_float = (now - start).total_seconds() / (end - start).total_seconds() * 100
          pct = int(pct_float)
          if now.month == 12 and now.day == 31:
              pct = 100

          last_file = pathlib.Path('.last_pct')
          last_pct = -1
          if last_file.exists():
              try:
                  last_pct = int(last_file.read_text().strip())
              except:
                  pass

          if pct == last_pct:
              print(f'今天 {pct}%, 上次也是 {pct}%, 不推送')
              exit(0)

          length = 25
          filled = int(pct * length / 100)
          bar = '█' * filled + '░' * (length - filled)
          days_passed = (now - start).days
          days_left = (end - start).days - days_passed

          card = {
              "msg_type": "interactive",
              "card": {
                  "header": {
                      "title": {"tag": "plain_text", "content": f"🌱 {year} 年进度 · {pct}%"},
                      "template": "green"
                  },
                  "elements": [
                      {"tag": "div", "text": {"tag": "lark_md", "content": f"`{bar}` **{pct}%**"}},
                      {"tag": "div", "text": {"tag": "lark_md", "content": f"📅 已过 {days_passed} 天 · 还剩 {days_left} 天"}}
                  ]
              }
          }

          payload = json.dumps(card).encode()
          req = urllib.request.Request(
              os.environ['WEBHOOK'],
              data=payload,
              headers={'Content-Type': 'application/json'}
          )
          print(urllib.request.urlopen(req).read().decode())

          last_file.write_text(str(pct))
          print(f'已推送 {pct}%')
          EOF

      - name: commit last percentage
        run: |
          if [[ -n $(git status -s .last_pct) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .last_pct
            git commit -m "progress: $(cat .last_pct)%"
            git push
          fi
